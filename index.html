                  }
                });
                // Always end exactly at payoff
                if(vbPts[vbPts.length-1].bal>0.01)vbPts.push({yr:result.months/12,bal:0});
                else vbPts[vbPts.length-1]={yr:result.months/12,bal:0};

                // CHART SETUP
                const maxYrs=Math.min(Math.ceil(result.baseline.months/12)+1,36);
                const W=760,H=340,PL=64,PR=28,PT=24,PB=72;
                const cW=W-PL-PR,cH=H-PT-PB;
                const maxBal=params.mortgageBal;
                const xs=yr=>PL+(Math.min(yr,maxYrs)/maxYrs)*cW;
                const ys=v=>PT+cH*(1-Math.min(Math.max(v,0)/maxBal,1));
                const mkPath=pts=>pts.map((p,i)=>`${i===0?"M":"L"}${xs(p.yr).toFixed(1)},${ys(p.bal).toFixed(1)}`).join(" ");

                const axisY=ys(0);
                const gridVals=[0,0.25,0.5,0.75,1].map(f=>maxBal*f);
                const xTicks=[];for(let y=0;y<=maxYrs;y+=5)xTicks.push(y);

                // Exact payoff x positions — taken from path endpoints
                const vbX=xs(result.months/12);
                const dX=xs(result.direct.months/12);
                const bX=xs(result.baseline.months/12);

                // Smart label positions: VB and Direct are close together, stagger them
                // VB above, Direct below, Baseline above
                const vbClose=Math.abs(vbX-dX)<60;

                return(
                <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px 18px",marginBottom:16}}>
                  <div style={{fontSize:10,color:C.accent,fontFamily:"monospace",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:4}}>// Debt Paydown Comparison</div>
                  <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:4}}>Total Remaining Debt — 3 Strategies Over Time</div>
                  <div style={{fontSize:12,color:C.textDim,marginBottom:12,lineHeight:1.5}}>Each line tracks total remaining debt (mortgage + HELOC). Lines hit $0 at payoff. The sooner the better.</div>
                  <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block"}}>
                    {/* Y gridlines + labels */}
                    {gridVals.map((v,i)=>(
                      <g key={i}>
                        <line x1={PL} y1={ys(v)} x2={PL+cW} y2={ys(v)} stroke="#1e2d45" strokeWidth={i===0?1.5:0.7}/>
                        <text x={PL-8} y={ys(v)+4} textAnchor="end" fontSize="10" fill="#4a5568" fontFamily="monospace">{v===0?"$0":"$"+(v/1000|0)+"k"}</text>
                      </g>
                    ))}
                    {/* X axis */}
                    <line x1={PL} y1={axisY} x2={PL+cW} y2={axisY} stroke="#2a3a55" strokeWidth="1.5"/>
                    {xTicks.map(yr=>(
                      <g key={yr}>
                        <line x1={xs(yr)} y1={axisY} x2={xs(yr)} y2={axisY+5} stroke="#2a3a55" strokeWidth="1"/>
                        <text x={xs(yr)} y={axisY+17} textAnchor="middle" fontSize="10" fill="#4a5568" fontFamily="monospace">Yr {yr}</text>
                      </g>
                    ))}
                    {/* LINES — baseline behind, VB on top */}
                    <path d={mkPath(bPts)} fill="none" stroke="#ff4d6d" strokeWidth="2" strokeDasharray="8,5" opacity="0.85"/>
                    <path d={mkPath(dPts)} fill="none" stroke="#ffb700" strokeWidth="2.5" strokeDasharray="4,3" opacity="0.9"/>
                    <path d={mkPath(vbPts)} fill="none" stroke="#00d4ff" strokeWidth="3.5" opacity="1"/>
                    {/* PAYOFF DOTS — on axis line */}
                    {bX<=PL+cW&&<circle cx={bX} cy={axisY} r="5" fill="#ff4d6d" stroke="#0a0e1a" strokeWidth="2"/>}
                    <circle cx={dX} cy={axisY} r="5" fill="#ffb700" stroke="#0a0e1a" strokeWidth="2"/>
                    <circle cx={vbX} cy={axisY} r="7" fill="#00d4ff" stroke="#0a0e1a" strokeWidth="2.5"/>
                    {/* PAYOFF LABELS — VB above, Direct below, Baseline above far right */}
                    {/* VB: above dot */}
                    <line x1={vbX} y1={axisY-9} x2={vbX} y2={axisY-26} stroke="#00d4ff" strokeWidth="1" opacity="0.5"/>
                    <rect x={vbX-38} y={axisY-44} width="76" height="16" rx="3" fill="#0d1f35" stroke="#00d4ff33" strokeWidth="1"/>
                    <text x={vbX} y={axisY-33} textAnchor="middle" fontSize="10" fill="#00d4ff" fontFamily="monospace" fontWeight="700">VB {mo(result.months)}</text>
                    {/* Direct: below axis — pushed down enough to clear */}
                    <line x1={dX} y1={axisY+9} x2={dX} y2={axisY+26} stroke="#ffb700" strokeWidth="1" opacity="0.5"/>
                    <rect x={dX-50} y={axisY+26} width="100" height="16" rx="3" fill="#0d1f35" stroke="#ffb70033" strokeWidth="1"/>
                    <text x={dX} y={axisY+38} textAnchor="middle" fontSize="10" fill="#ffb700" fontFamily="monospace" fontWeight="700">Direct {mo(result.direct.months)}</text>
                    {/* Baseline: above dot, clamped to right edge */}
                    {bX<=PL+cW&&(()=>{
                      const lx=Math.min(Math.max(bX,PL+60),PL+cW-60);
                      return(<g>
                        <line x1={bX} y1={axisY-9} x2={bX} y2={axisY-26} stroke="#ff4d6d" strokeWidth="1" opacity="0.5"/>
                        <rect x={lx-58} y={axisY-44} width="116" height="16" rx="3" fill="#0d1f35" stroke="#ff4d6d33" strokeWidth="1"/>
                        <text x={lx} y={axisY-33} textAnchor="middle" fontSize="10" fill="#ff4d6d" fontFamily="monospace" fontWeight="700">Standard {mo(result.baseline.months)}</text>
                      </g>);
                    })()}
                  </svg>
                  {/* Legend cards */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginTop:14}}>
                    {[
                      {color:"#ff4d6d",dash:"8,5",label:"Standard Amortization",payoff:mo(result.baseline.months),interest:fmt(result.baseline.totalInt),note:"Minimum required payments only"},
                      {color:"#00d4ff",dash:"",label:"Velocity Banking",payoff:mo(result.months),interest:fmt(result.total),note:`${result.cycleCount} chunk${result.cycleCount!==1?"s":""} · HELOC cost: ${fmt(result.totalHInt)}`},
                      {color:"#ffb700",dash:"4,3",label:"Direct Extra Payments",payoff:mo(result.direct.months),interest:fmt(result.direct.totalInt),note:`+${fmt(extra2)}/mo extra · equity locked`},
                    ].map(({color,dash,label,payoff,interest,note})=>(
                      <div key={label} style={{background:C.bg,borderRadius:8,padding:"12px 14px",borderTop:`2px solid ${color}`,border:`1px solid ${color}33`,borderTopColor:color}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                          <svg width="28" height="10" style={{flexShrink:0}}><line x1="0" y1="5" x2="28" y2="5" stroke={color} strokeWidth="2.5" strokeDasharray={dash}/></svg>
                          <span style={{fontSize:12,fontWeight:700,color}}>{label}</span>
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
                          <div><div style={{fontSize:9,color:"#4a5568",fontFamily:"monospace",textTransform:"uppercase",marginBottom:2}}>Payoff</div><div style={{fontSize:14,fontFamily:"monospace",fontWeight:700,color:C.text}}>{payoff}</div></div>
                          <div><div style={{fontSize:9,color:"#4a5568",fontFamily:"monospace",textTransform:"uppercase",marginBottom:2}}>Total Interest</div><div style={{fontSize:14,fontFamily:"monospace",fontWeight:700,color:C.amber}}>{interest}</div></div>
                        </div>
                        <div style={{fontSize:11,color:"#4a5568",lineHeight:1.5}}>{note}</div>
                      </div>
                    ))}
                  </div>
                </div>
                );
              })()}

              {/* ── BOTTOM: Payoff Story + Tables ── */}
              {/* Payoff Story strip */}
              <div style={{background:C.surfaceAlt,border:`1px solid ${C.border}`,borderRadius:10,padding:"14px 18px",marginBottom:16}}>
                <div style={{fontSize:10,color:C.accent,fontFamily:"monospace",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:12}}>// Your Payoff Story — The Velocity Banking Cycle</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:0}}>
                  {[
                    {step:"Day 0 — The Chunk",color:C.accent,text:`Draw ${fmt(result.initialDraw)} from ${useRentalHeloc&&rentalDirection==="heloc_on_rental"?"rental property HELOC":useRentalHeloc&&rentalDirection==="heloc_on_primary"?"primary home HELOC":"your HELOC"} → apply to ${useRentalHeloc&&rentalDirection==="heloc_on_primary"?"rental":"primary"} mortgage principal. Balance drops to ${fmt(params.mortgageBal-result.initialDraw)}. Apply ${fmt(result.savingsApplied)} savings → HELOC starts at ${fmt(result.initialDraw-result.savingsApplied)}.`},
                    {step:"Paycheck Parking",color:C.green,text:`Direct deposit entire paycheck (${fmt(monthlyIncome)}) into HELOC on payday. Every dollar immediately reduces average daily balance. Bills go on credit card — paid from HELOC at month end.`},
                    {step:"Daily Interest",color:C.amber,text:`HELOC charges interest daily on outstanding balance only. Month 1: ~${fmt((result.initialDraw-result.savingsApplied)*(helocRate/100/12))}. Drops every month as balance declines.`},
                    {step:"Cycle Completion",color:C.accent,text:`HELOC hits $0 in ~${Math.round(result.months/result.cycleCount)} months. Draw the next equity chunk onto the mortgage. Repeat ${result.cycleCount}× total cycles.`},
                    {step:"Mortgage Free",color:C.green,text:`Done in ${mo(result.months)} vs ${mo(result.baseline.months)} standard amortization. Eliminated ${fmt(result.interestSavedVsBaseline)} in interest. HELOC remains open.`},
                  ].map(({step,color,text},i,arr)=>(
                    <div key={step} style={{padding:"0 14px",borderRight:i<arr.length-1?`1px solid ${C.border}`:"none"}}>
                      <div style={{fontSize:10,color,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:700,marginBottom:5}}>{step}</div>
                      <div style={{fontSize:12,color:C.textMid,lineHeight:1.6}}>{text}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Tab toggle */}
              <div style={{display:"flex",gap:2,marginBottom:14,background:C.surface,padding:4,borderRadius:8,border:`1px solid ${C.border}`}}>
                {[["year-by-year","Year-by-Year"],["cycles-comparison","Cycles & Comparison"]].map(([t,l])=><Tab key={t} label={l} active={tab===t} onClick={()=>setTab(t)}/>)}
              </div>

              {/* Tab panels */}
              <div style={{overflowX:"auto"}}>

                {/* Year-by-Year */}
              <div style={{display:tab==="year-by-year"?"block":"none",background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
                <div style={{overflowX:"auto"}}>
                  <table style={{minWidth:780}}>
                    <thead>
                      <tr style={{background:C.bg}}>
                        {["Year","Mortgage Bal","HELOC Bal","Yr Mtg Int","Yr HELOC Int","Blended Rate","Saved vs Nothing","Liquidity","Notes"].map(h=>(
                          <th key={h} style={{padding:"10px 12px",textAlign:"left",fontSize:9,color:C.textDim,fontFamily:"monospace",letterSpacing:"0.04em",textTransform:"uppercase",fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {result.yearData.map((y,i)=>{
                        const prevY=i>0?result.yearData[i-1]:null;
                        const note=plainEnglishRow(y,prevY,result.cycleLog);
                        const isBreakeven=y.savedVsNothing>0&&(!prevY||prevY.savedVsNothing<=0);
                        return(
                          <tr key={i} style={{borderBottom:`1px solid ${C.border}`,background:i%2===0?"transparent":C.surfaceAlt+"22"}}>
                            <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:13,color:C.textMid,whiteSpace:"nowrap"}}>{y.partial?`Yr ${y.year}*`:`Year ${y.year}`}</td>
                            <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:13,color:C.text,whiteSpace:"nowrap"}}>{y.mBal>0?fmt(y.mBal):<span style={{color:C.green,fontWeight:700}}>✓ PAID</span>}</td>
                            <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:13,color:C.text,whiteSpace:"nowrap"}}>{fmt(y.hBal)}</td>
                            <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:13,color:C.amber,whiteSpace:"nowrap"}}>{fmt(y.yrMInt)}</td>
                            <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:13,color:y.yrHInt>y.yrMInt?C.red:C.accent,whiteSpace:"nowrap"}}>{fmt(y.yrHInt)}</td>
                            <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:13,color:C.textMid,whiteSpace:"nowrap"}}>{y.blendedRate>0?y.blendedRate.toFixed(2)+"%":"—"}</td>
                            <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:13,color:y.savedVsNothing>0?C.green:C.red,fontWeight:isBreakeven?700:400,whiteSpace:"nowrap"}}>{y.savedVsNothing>0?"+":""}{fmt(y.savedVsNothing)}{isBreakeven?" ✓":""}</td>
                            <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:13,color:C.green,whiteSpace:"nowrap"}}>{fmt(y.liquidity)}</td>
                            <td style={{padding:"9px 12px",fontSize:12,color:C.textDim,fontStyle:"italic",minWidth:160}}>{note}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <div style={{padding:"8px 14px",borderTop:`1px solid ${C.border}`,fontSize:10,color:C.textDim,fontFamily:"monospace",display:"flex",gap:16,flexWrap:"wrap"}}>
                  <span>* Partial year</span>
                  <span style={{color:C.red}}>■ HELOC Int red = exceeds mortgage int that year</span>
                  <span style={{color:C.green}}>■ Saved vs Nothing turns green at break-even</span>
                </div>
              </div>

              {/* Cycles & Comparison — side by side */}
              <div style={{display:tab==="cycles-comparison"?"grid":"none",gridTemplateColumns:"1fr 1fr",gap:16,alignItems:"start"}}>

                {/* Cycles */}
                <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
                  <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`}}>
                    <div style={{fontSize:11,color:C.textMid,fontFamily:"monospace",marginBottom:4}}>{result.cycleCount} total cycle{result.cycleCount>1?"s":""} — each a lump sum onto principal</div>
                    <div style={{fontSize:11,color:C.textDim,lineHeight:1.5}}>Each cycle draw grows because both your home value and available equity increase over time. Your HELOC line limit is set at origination — subsequent cycles redraw against the same approved limit{params.helocCap>0?` (capped at ${fmt(params.helocCap)})`:", up to the approved ceiling"}. To model a fixed line limit, set it in HELOC Settings.</div>
                  </div>
                  {result.cycleLog.map((c,i)=>(
                    <div key={i} style={{padding:"14px 16px",borderBottom:i<result.cycleLog.length-1?`1px solid ${C.border}`:"none",display:"flex",gap:12,alignItems:"flex-start"}}>
                      <div style={{width:30,height:30,borderRadius:"50%",flexShrink:0,background:i===0?C.accentGlow:C.surfaceAlt,border:`2px solid ${i===0?C.accent:C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"monospace",fontSize:11,fontWeight:700,color:i===0?C.accent:C.textMid}}>{c.cycle}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:3,gap:6}}>
                          <span style={{fontFamily:"monospace",fontSize:12,color:C.text,flexShrink:0}}>{c.month===0?"Day 0 — Initial Draw":`Month ${c.month} — Redraw`}</span>
                          <span style={{fontFamily:"monospace",fontSize:13,color:C.accent,fontWeight:700,flexShrink:0}}>{fmt(c.draw)}</span>
                        </div>
                        <div style={{fontSize:11,color:C.textMid,lineHeight:1.6}}>
                          {c.month===0
                            ?`Mortgage → ${fmt(c.mortgageAfter)}. HELOC starts at ${fmt(c.draw-result.savingsApplied)} after ${fmt(result.savingsApplied)} savings.`
                            :`Drew ${fmt(c.draw)} onto mortgage. Mortgage → ${fmt(c.mortgageAfter)}. (${Math.round(c.draw/(c.ceiling||1)*100)}% of ${fmt(c.ceiling||0)} available equity${params.helocCap>0&&c.draw>=params.helocCap-100?` — capped by your ${fmt(params.helocCap)} line limit`:""})`}
                        </div>
                      </div>
                    </div>
                  ))}
                  <div style={{padding:"10px 16px",background:C.bg,borderTop:`1px solid ${C.border}`,fontSize:10,color:C.textMid,lineHeight:1.5}}>Each redraw eliminates principal that would have accrued interest for years.</div>
                </div>

                {/* Comparison */}
                <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
                  <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,fontSize:11,color:C.textMid,fontFamily:"monospace"}}>Three strategies — same income</div>
                  {[
                    {label:`Standard Amortization — No Extra Payments`,payoff:mo(result.baseline.months),mInt:result.baseline.totalInt,hInt:0,total:result.baseline.totalInt,liquidity:"Full liquidity — no equity locked up beyond normal amortization",color:C.textMid,note:"Default path — every payment follows the front-loaded amortization schedule.",highlight:false},
                    {label:`Velocity Banking — ${result.cycleCount} cycle${result.cycleCount!==1?'s':''}`,payoff:mo(result.months),mInt:result.totalMInt,hInt:result.totalHInt,total:result.total,liquidity:`${fmt(result.ltvCeiling)} line accessible`,color:C.accent,note:"Early payoff + savings + liquidity.",highlight:true},
                    {label:"Direct Extra Payments",payoff:mo(result.direct.months),mInt:result.direct.totalInt,hInt:0,total:result.direct.totalInt,liquidity:"$0 liquid — locked in equity",color:C.amber,note:"Lowest interest, no liquidity.",highlight:false},
                  ].map((s,i)=>(
                    <div key={i} style={{padding:"14px 16px",borderBottom:i<2?`1px solid ${C.border}`:"none",background:s.highlight?C.accentGlow:"transparent",borderLeft:`3px solid ${s.highlight?C.accent:"transparent"}`}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8,gap:6}}>
                        <span style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:s.color,lineHeight:1.3}}>{s.label}</span>
                        <span style={{fontFamily:"monospace",fontSize:14,fontWeight:700,color:C.text,flexShrink:0}}>{s.payoff}</span>
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:8}}>
                        {[["Mtg Int",fmt(s.mInt),C.amber],["HELOC Int",fmt(s.hInt),s.hInt>0?C.accent:C.textDim],["Total",fmt(s.total),s.color]].map(([lbl,val,col])=>(
                          <div key={lbl} style={{background:C.surfaceAlt,borderRadius:5,padding:"7px 8px"}}>
                            <div style={{fontSize:8,color:C.textDim,fontFamily:"monospace",textTransform:"uppercase",marginBottom:2}}>{lbl}</div>
                            <div style={{fontSize:12,fontFamily:"monospace",color:col,fontWeight:700}}>{val}</div>
                          </div>
                        ))}
                      </div>
                      <div style={{fontSize:10,color:C.textDim}}>{s.liquidity}</div>
                      <div style={{fontSize:10,color:C.textDim,fontStyle:"italic",marginTop:2}}>{s.note}</div>
                    </div>
                  ))}
                </div>

              </div>

              </div>{/* end tab panels */}
            </>}

            {!result&&<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:36,textAlign:"center"}}>
              <div style={{fontSize:44,marginBottom:14}}>🏠</div>
              <div style={{color:C.red,fontFamily:"monospace",fontSize:15,marginBottom:12,fontWeight:700}}>INSUFFICIENT EQUITY FOR A HELOC</div>
              <div style={{color:C.textMid,fontSize:13,lineHeight:1.8}}>Your mortgage balance (<strong style={{color:C.text}}>{fmt(mortgageBal)}</strong>) exceeds the {ltvLimit}% LTV ceiling (<strong style={{color:C.text}}>{fmt(homeValue*ltvLimit/100)}</strong>).<br/>You need <strong style={{color:C.amber}}>{fmt(mortgageBal-homeValue*ltvLimit/100)}</strong> more equity to qualify.<br/><br/>Try raising your home value estimate, adjusting the LTV limit, or lowering your mortgage balance to explore future scenarios.</div>
            </div>}
        </div>}
      </div>

      {/* FOOTER */}
      <div style={{maxWidth:1200,margin:"32px auto 0",padding:"20px 28px 0",borderTop:`1px solid ${C.border}`}}>
        <p style={{fontSize:12,color:C.textDim,fontFamily:"monospace",textAlign:"center",lineHeight:1.8}}>For educational purposes only. Not financial advice. Consult a licensed financial advisor and your lender before making mortgage decisions.<br/>Assumes {ltvLimit}% LTV HELOC · Income deposited 1st & 15th · CC paid day 25 · {appreciationRate}%/yr home appreciation · Exact daily interest accrual.</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
