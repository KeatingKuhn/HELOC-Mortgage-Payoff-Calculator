<script type="text/babel">
const {useState,useEffect} = React;
const C={bg:"#0a0e1a",surface:"#111827",surfaceAlt:"#1a2235",border:"#1e2d45",accent:"#00d4ff",accentDim:"#0099bb",accentGlow:"rgba(0,212,255,0.12)",green:"#00e5a0",greenDim:"rgba(0,229,160,0.10)",red:"#ff4d6d",redDim:"rgba(255,77,109,0.10)",amber:"#ffb700",amberDim:"rgba(255,183,0,0.10)",text:"#e8f0fe",textMid:"#8899bb",textDim:"#4a5568"};

const FAQS=[
  {q:"Where does the velocity banking strategy come from?",a:"Velocity banking has roots that predate modern finance. Before the 1930s, homes were commonly financed with flexible lines of credit — open instruments where money flowed in and out freely. The 30-year fixed mortgage was engineered to create predictable, front-loaded interest income for banks. Velocity banking revives the older, more efficient approach: use a revolving line of credit as your primary financial account, route all income through it, and systematically eliminate mortgage principal in lump-sum chunks. The math has always been there. Most homeowners were simply never shown it."},
  {q:"What is velocity banking and what does 'chunking' mean?",a:"Velocity banking is a strategy where you use a HELOC as your primary bank account, routing all income through it to minimize daily interest, then periodically drawing lump sums (chunks) onto your mortgage principal to eliminate front-loaded interest. The core insight is this: time and balance are more important than interest rate. A mortgage keeps a massive balance for decades. A HELOC balance drops aggressively every month as income flows through. The result: even at a higher HELOC rate, you pay far less total interest because the balance at risk is always shrinking."},
  {q:"If my HELOC rate is higher than my mortgage rate, how does this still save money?",a:"This is the most common objection — here's the honest answer. The HELOC balance is never fixed. It drops every month as your income flows through it. You're paying a higher rate on a rapidly declining number, not a fixed one. Meanwhile, the lump-sum chunks onto the mortgage eliminate massive blocks of principal and all the compounding interest that would have accrued on them for decades. The net effect: total HELOC interest over the entire strategy is often only a few thousand dollars per year, while mortgage interest saved is in the tens of thousands. The math works because you're comparing a small, shrinking HELOC against a large, slow-moving mortgage."},
  {q:"What is paycheck parking and why does it matter?",a:"Paycheck parking is depositing your entire paycheck directly into the HELOC the moment you're paid, rather than into a checking account. Every dollar sitting in the HELOC reduces its balance — which reduces the average daily balance — which reduces interest charged that month. The math is simple: money sitting in a checking account earns nearly nothing while your HELOC charges interest daily. Parking your paycheck in the HELOC the day it arrives, and paying bills at the end of the month via credit card, maximizes the time your income spends reducing the HELOC balance. Some community banks offer sweep accounts that automate this."},
  {q:"Why use a community bank or credit union instead of a big bank?",a:"Big banks typically don't support HELOC-as-checking-account banking and often won't allow direct deposit into a HELOC. Community banks and credit unions are more likely to offer: direct deposit capability into a HELOC, debit card access to draw funds, online bill pay, sweep accounts that automatically move checking balances to the HELOC, better rates and fewer fees. Avoid big national banks for this strategy. Call local credit unions first — ask specifically if they allow direct deposit into a HELOC and if they offer a sweep account."},
  {q:"What is the 'equity draw per cycle' and why does 25% often work best?",a:"When your HELOC hits $0 that's a completed cycle. You then draw new equity from your home and chunk it onto the mortgage. The draw percentage controls the size of each chunk. Drawing 100% means carrying a large HELOC balance at a higher rate for a long time. Drawing 25% keeps the HELOC small so it clears fast and stays cheap — while still delivering meaningful mortgage paydown. At low mortgage rates (3–4%), go even lower (10–15%) to minimize HELOC interest. At higher mortgage rates (5%+), you can go higher since the rate differential is smaller."},
  {q:"What is LTV and how does it affect my available credit?",a:"LTV stands for Loan-to-Value — your mortgage balance divided by your home's value. Most lenders cap combined mortgage + HELOC at 80% LTV. Example: $500k home × 80% = $400k ceiling. If you owe $320k, you can access up to $80k via HELOC. As your mortgage drops AND as your home appreciates, your available ceiling grows — allowing larger chunks each cycle. Home appreciation is a powerful multiplier: a $500k home appreciating 4%/yr adds $20k per year to your HELOC ceiling independently of any principal paydown."},
  {q:"Should I use my HELOC as my actual checking account?",a:"Yes — this is the core mechanic. When your paycheck hits the HELOC, your balance drops before expenses leave. That temporary reduction lowers your average daily balance for the month, reducing interest. Using a credit card for daily purchases (paid in full from the HELOC monthly) extends the time your income sits in the HELOC. Keep credit cards open and active — strong credit is important for maintaining HELOC access. Critical rule: never carry a credit card balance. Pay it in full every month from the HELOC."},
  {q:"What are the real risks?",a:"Go in clear-eyed: (1) Variable rate risk — HELOCs are variable. If Prime rises your HELOC interest increases. Model a worst case in the calculator. (2) Income dependence — if income drops or expenses spike, the HELOC balance may stop declining. Build a real emergency fund separate from the HELOC before starting. (3) Discipline required — the HELOC is accessible 24/7. One major non-essential draw can derail a cycle. (4) Bank can freeze the line — if home values drop, lenders have frozen HELOCs during downturns. (5) Draw period — HELOCs typically have a 10-year draw period, then convert to repayment. Ensure your payoff timeline fits."},
  {q:"Do I need good credit to open a HELOC?",a:"Most lenders require 620+ credit score, with better rates at 700+. You also need: at least 20% equity, stable verifiable income, debt-to-income ratio under 43%, and the home as your primary residence. The move: shop multiple community banks and credit unions — don't just go to your existing bank. Rates and terms vary significantly. Ask specifically about draw period length, whether they allow direct deposit into the HELOC, and whether there are early termination fees."},
  {q:"Is HELOC interest tax deductible?",a:"Under current US tax law (post-2017 Tax Cuts and Jobs Act), HELOC interest is only deductible if funds are used to buy, build, or substantially improve the home securing the loan. Using HELOC funds to pay down your mortgage principal likely does not qualify. Consult a CPA for your specific situation — don't count on a deduction when running your numbers."},
  {q:"My mortgage rate is 2.5–4%. Does velocity banking still make sense?",a:"Even at low mortgage rates, the strategy has value — the argument just shifts from pure interest savings to liquidity and payoff acceleration. At 3.25% mortgage vs 8.5% HELOC, you're borrowing at a premium — but the HELOC pays down fast (months, not decades) and the mortgage principal elimination is large. The net HELOC interest cost is modest. Meanwhile, extra payments made directly to a 3.25% mortgage lock your cash away permanently unless you refinance. With the HELOC strategy, your money stays accessible at all times. Set the redraw slider low (10–15%) to minimize HELOC interest cost, and check the break-even year. If it crosses positive before your target payoff, the strategy wins."},
  {q:"Am I paying more money short-term with this strategy?",a:"Yes — slightly, and it's worth understanding why. In the first few months, you have both a mortgage payment AND HELOC interest to cover. The HELOC interest is real money going out. However, two things are happening simultaneously: (1) your mortgage principal is dropping faster than it ever would on a standard schedule, and (2) your HELOC balance is falling every month as your income flows through it. The total extra cost in Year 1 is typically a few hundred to a couple thousand dollars in HELOC interest. That's the 'price of admission' for eliminating tens or hundreds of thousands in future mortgage interest. Think of it as a small upfront cost to break out of the amortization trap. The break-even timeline in the Risk tab shows exactly when your cumulative savings overtake that early HELOC cost."},
  {q:"Am I using more of my income with velocity banking than I would be otherwise?",a:"No — this is one of the most important things to understand. The strategy does NOT require you to contribute more money than you're already spending. Your income stays the same. Your expenses stay the same. What changes is the routing: instead of income landing in a checking account where it earns nothing while your HELOC charges interest, income is deposited directly into the HELOC to reduce the balance daily. The HELOC pays your bills and mortgage payment on your behalf. Your monthly cash outflow is identical — but every dollar now spends time reducing interest before it leaves. The only discipline required is not drawing additional HELOC funds for discretionary spending."},
  {q:"Is the whole point just to shorten the loan and save interest — or is there more to it?",a:"Shortening the mortgage and saving interest is the primary outcome, but there are three additional benefits most people don't initially appreciate. First, liquidity: every dollar of equity you've built through chunking is still accessible via the HELOC — unlike extra payments directly to a mortgage, which are locked until you sell or refinance. Second, compounding savings: each chunk eliminates principal that would have generated interest for years. That eliminated principal never gets the chance to compound against you. Third, financial flexibility: once the mortgage is gone, the HELOC remains open as a powerful financial tool — a large, secured credit line for investment opportunities, emergencies, or your next property. The mortgage payoff is the destination. The HELOC is a permanent upgrade to your financial infrastructure."},
  {q:"How does velocity banking compare to just making extra principal payments every month?",a:"They often reach similar payoff timelines — but with a critical difference: liquidity. With direct extra payments, every surplus dollar you send to the mortgage is locked in equity. If you lose your job, face a medical emergency, or find an investment opportunity, that money is inaccessible without a refinance. With velocity banking, your surplus flows through the HELOC, which remains open. The money is working against your debt AND remains accessible simultaneously. The total interest cost of velocity banking is typically slightly higher than direct extra payments (HELOC interest adds a small premium) but most people find the liquidity worth far more than the difference. Run the calculator — the 'vs Locking Cash Away' card in the Results tab shows you exactly what that liquidity premium costs in your specific scenario."},
  {q:"What is the difference between the mortgage balance and total debt shown in the chart?",a:"The chart shows total remaining debt — mortgage balance plus any outstanding HELOC balance — at the end of each year. For the standard amortization line, total debt is just the mortgage balance declining slowly over time. For velocity banking, total debt includes both: immediately after a chunk, debt may temporarily show as mortgage + HELOC. But as the HELOC pays down from income over the following months, total debt drops faster than the mortgage alone ever would. For direct extra payments, total debt starts lower (savings are applied immediately) and declines steadily. All three lines eventually reach $0 — the velocity banking and direct lines just get there dramatically earlier."},
  {q:"How do I actually pay the interest on my HELOC each month?",a:"HELOC interest is charged daily and billed monthly. Here's exactly how it works in the velocity banking setup:\n\nEach day, your lender calculates: (Outstanding Balance × Annual Rate) ÷ 365 = that day's interest charge. These daily charges accumulate and are billed to you at the end of the statement period.\n\nIn practice, you don't write a separate check for HELOC interest. The interest charge is simply added to your HELOC balance each month. When you deposit your paycheck into the HELOC, that deposit simultaneously pays down both the principal and any accrued interest — because the HELOC works like a running account balance, not a fixed loan with a payment schedule.\n\nExample: $20,000 HELOC balance at 8.5% rate. Daily interest = ($20,000 × 0.085) ÷ 365 = $4.66/day. After 30 days = ~$140 added to your balance. When your $5,000 paycheck deposits on day 1 of next month, your balance drops from $20,140 to $15,140. The interest was paid implicitly — you never write a check for it.\n\nThis is why paycheck parking works: the sooner income hits the HELOC, the fewer days that balance sits high, and the less interest accumulates."},
  {q:"What is a HELOC draw period and repayment period — and how does it affect this strategy?",a:"A HELOC has two phases:\n\nDraw period (typically 10 years): You can borrow and repay freely. Interest accrues only on what you owe. Most lenders require interest-only minimum payments during this phase — but you can always pay more. This is the phase you use for velocity banking.\n\nRepayment period (typically 10-20 years): The line closes, you can no longer draw, and the outstanding balance converts to a fixed repayment schedule — similar to a mortgage. Minimum payments increase substantially.\n\nFor velocity banking: if your payoff timeline is under 7 years (which it typically is with strong cash flow), you'll complete the strategy entirely within the draw period and never enter repayment. However, if your surplus is low and the calculator projects 12+ years, you need to confirm your draw period length with your lender. Some lenders offer 5-year draw periods — avoid these for this strategy. Ask for at least 10 years.\n\nThe interest-only minimum during the draw period is a safety net: even in a difficult month, your minimum HELOC obligation is just the accrued interest — often under $200 — not a full amortized payment."},
  {q:"Is my HELOC interest rate fixed or variable — and what happens if rates rise?",a:"HELOC rates are almost always variable, tied to the Prime Rate (set by the Federal Reserve) plus a margin your lender adds. Example: Prime Rate (currently ~7.5%) + 1% margin = 8.5% HELOC rate. If the Fed raises rates by 0.5%, your HELOC becomes 9.0%.\n\nWhat this means in practice:\n\nYour monthly HELOC interest cost changes when Prime changes. On a $25,000 HELOC balance, a 1% rate increase = ~$21/month more in interest. Not catastrophic, but real.\n\nThe strategy still works at higher HELOC rates — your surplus still drives down the balance. But the math becomes less favorable the higher the HELOC rate climbs relative to your mortgage rate. Use the Risk Scenarios tab to see the impact of +2% and +4% rate increases on your specific numbers.\n\nProtective moves: (1) Keep HELOC balances small — smaller balances mean rate changes hurt less. This is another reason the 25% chunk size is often preferred. (2) Ask your lender if they offer a rate cap or a fixed-rate conversion option on a portion of the balance. (3) If rates rise significantly, you can pause redraws and let surplus pay down the HELOC normally without chunking."},
  {q:"Can the bank cancel or freeze my HELOC?",a:"Yes — this is a real risk that borrowers experienced widely during the 2008-2009 housing crisis. Lenders have the right to reduce or freeze a HELOC if:\n\n• Your home's value drops and the combined LTV exceeds their limit\n• Your credit score falls significantly\n• You miss payments or have other derogatory credit events\n• The lender determines you have a material change in financial circumstances\n\nDuring 2008-2009, major banks froze hundreds of thousands of HELOCs with little warning, even for borrowers who were current on all payments.\n\nHow to reduce this risk: (1) Use a community bank or credit union — they tend to be more conservative in their lending and less reactive during downturns. (2) Keep the LTV well below 80% by not drawing the maximum available. (3) Stay current on all payments. (4) Don't rely on the HELOC as your only emergency fund — keep separate liquid savings. (5) Understand that if your home value drops 20% and your HELOC is frozen mid-strategy, you may need to fall back to direct extra payments until the line is reinstated.\n\nThe freeze risk is real, but manageable if you go in prepared."},
  {q:"What happens to my HELOC when the mortgage is paid off?",a:"When the mortgage is fully paid off, the HELOC remains open and independent. It becomes a first-lien product against your now-unencumbered home — meaning it's secured by a home with no other debt against it.\n\nAt this point, you have a large, open line of credit secured by your home at a competitive interest rate. Many people treat it as a permanent financial tool: an accessible credit line for investment opportunities, rental property down payments, business capital, or a self-funded emergency reserve.\n\nImportant: the HELOC draw period continues from when you opened it, not from when the mortgage was paid off. If you opened the HELOC and it has a 10-year draw period, and you paid off the mortgage in year 6, you have 4 years of draw period remaining. After that, any outstanding balance converts to a repayment schedule.\n\nMany people choose to pay off any remaining HELOC balance at mortgage payoff — at which point you have a fully paid home and an open $0-balance credit line available whenever you need it. That's a genuinely powerful financial position."},
  {q:"What's the difference between a HELOC and a home equity loan?",a:"These two products are frequently confused but work very differently:\n\nHELOC (Home Equity Line of Credit): Revolving credit line. Borrow, repay, borrow again during the draw period. Variable rate. Interest charges on daily average balance only. No fixed payment schedule. This is what velocity banking uses.\n\nHome Equity Loan: Lump sum disbursement upfront. Fixed interest rate. Fixed monthly payment. Amortized like a mortgage — front-loaded interest. No ability to re-draw.\n\nFor this strategy, you need a HELOC — not a home equity loan. The revolving nature is essential: it allows income to flow in and reduce the balance, then equity to flow out in chunks onto the mortgage. A home equity loan's fixed structure would not allow this.\n\nA second important distinction: a HELOC charges interest only on the outstanding balance each day. A home equity loan charges interest on the full loan amount from day one. Even if they have the same rate, the HELOC will cost less in interest if you're actively paying it down — which is exactly what this strategy does."},
];

function simulate(p){
  const{mortgageBal,mortgageRate,mortgagePmt,homeValue,helocRate,monthlyIncome,livingExpenses,monthlyDebts,savings,redrawPct,ltvLimit,appreciationRate,helocFees,remainingYears,helocCap,rentalMortBal=0}=p;
  const ltv=ltvLimit/100;
  const dailyRate=helocRate/100/365;
  const mr=mortgageRate/100/12;
  const ar=appreciationRate/100/12;
  let currentHomeValue=homeValue;
  // In rental mode, available HELOC = rental equity (rental value - rental mortgage)
  // In standard mode, available HELOC = primary home equity (home value - primary mortgage)
  const maxDraw=Math.max(0,rentalMortBal>0?(currentHomeValue*ltv-rentalMortBal):(currentHomeValue*ltv-mortgageBal));
  if(maxDraw<5000)return null;
  // helocCap = lender-approved line limit (may be less than full equity)
  const lineCap=helocCap>0?helocCap:maxDraw;
  const initialDraw=Math.min(maxDraw,lineCap,mortgageBal);
  const savingsApplied=Math.min(savings,initialDraw);
  let mBal=mortgageBal-initialDraw,hBal=initialDraw-savingsApplied;
  let totalMInt=0,totalHInt=0,totalFeesPaid=helocFees.origination,month=0;
  const yearData=[],cycleLog=[{cycle:1,month:0,draw:initialDraw,mortgageAfter:mBal,homeValue:currentHomeValue}];
  let yrMInt=0,yrHInt=0,cycleCount=1;

  // baseline interest (no action) — calculate upfront
  // Compute P+I only for amortization (escrow/T&I doesn't reduce principal)
  const piPmt=(()=>{const n=remainingYears*12;const r=mr;if(r===0)return mortgageBal/n;return mortgageBal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);})();
  let bMBal=mortgageBal,bMo=0,bMInt=0;
  while(bMBal>0.01&&bMo<600){bMo++;const i=bMBal*mr;bMInt+=i;bMBal=Math.max(0,bMBal+i-piPmt);}
  // running baseline interest for cumulative comparison
  let bMBalR=mortgageBal,bIntSoFar=0;

  function oneMonth(hb,mp,dp){
    let bal=hb+mp+dp,cashBuf=0,interest=0;
    const half=monthlyIncome/2;
    for(let day=1;day<=30;day++){
      if(day===1||day===15){const pay=Math.min(bal,half);bal-=pay;cashBuf+=(half-pay);}
      if(day===25){const fc=Math.min(cashBuf,livingExpenses);cashBuf-=fc;bal+=(livingExpenses-fc);bal=Math.max(0,bal);}
      interest+=Math.max(0,bal)*dailyRate;
    }
    return{endBal:Math.max(0,bal-cashBuf),interest};
  }

  while((mBal>0.01||hBal>0.01)&&month<600){
    month++;
    // home appreciates monthly
    currentHomeValue*=(1+ar);
    const mp=mBal>0?mortgagePmt:0;
    const r=oneMonth(hBal,mp,monthlyDebts);
    totalHInt+=r.interest;yrHInt+=r.interest;hBal=r.endBal;
    // annual HELOC fee
    if(month%12===0){totalFeesPaid+=helocFees.annual;yrHInt+=helocFees.annual;}
    if(mBal>0){const mInt=mBal*mr;totalMInt+=mInt;yrMInt+=mInt;mBal=Math.max(0,mBal+mInt-piPmt);}
    // baseline tracking
    if(bMBalR>0){const bi=bMBalR*mr;bIntSoFar+=bi;bMBalR=Math.max(0,bMBalR+bi-piPmt);}

    if(hBal<500&&mBal>1000){
      // For rental HELOC: ceiling based on rental mortgage, not primary
      const ceiling=rentalMortBal>0?(currentHomeValue*ltv-rentalMortBal):currentHomeValue*ltv-mBal;
      // Each draw is capped by both the equity-based ceiling and the approved line limit
      const draw=Math.min(ceiling*redrawPct,mBal,lineCap);
      if(draw>1000){mBal-=draw;hBal=draw;cycleCount++;cycleLog.push({cycle:cycleCount,month,draw,mortgageAfter:mBal,homeValue:currentHomeValue,ceiling});}
    }
    if(month%12===0){
      const totalPaid=totalMInt+totalHInt+totalFeesPaid;
      const blendedRate=mBal>0?(totalMInt/month*12/((mortgageBal+mBal)/2)*100):0;
      const savedVsNothing=bIntSoFar-totalPaid;
      yearData.push({year:month/12,mBal,hBal,yrMInt,yrHInt,yrTotal:yrMInt+yrHInt,cumTotal:totalPaid,liquidity:Math.max(0,currentHomeValue*ltv-mBal-hBal),homeValue:currentHomeValue,blendedRate,savedVsNothing,hasCycle:cycleLog.some(c=>c.month>0&&Math.floor((c.month-1)/12)===month/12-1)});
      yrMInt=0;yrHInt=0;
    }
  }
  if(month%12!==0){
    yearData.push({year:Math.ceil(month/12),mBal:0,hBal:0,yrMInt,yrHInt,yrTotal:yrMInt+yrHInt,cumTotal:totalMInt+totalHInt+totalFeesPaid,liquidity:currentHomeValue*ltv,partial:true,homeValue:currentHomeValue,blendedRate:0,savedVsNothing:bMInt-(totalMInt+totalHInt+totalFeesPaid),hasCycle:false});
  }

  let dMBal=Math.max(0,mortgageBal-savings),dMo=0,dMInt=0;
  // extra: surplus available for direct payments = income minus all actual costs
  // Use piPmt (not mortgagePmt) and livingExpenses (simLivingExpenses) to avoid T&I double-count
  const extra=Math.max(0,monthlyIncome-livingExpenses-piPmt);
  while(dMBal>0.01&&dMo<600){dMo++;const i=dMBal*mr;dMInt+=i;dMBal=Math.max(0,dMBal+i-Math.min(dMBal+i,piPmt+extra));}

  const totalCost=totalMInt+totalHInt+totalFeesPaid;
  return{months:month,totalMInt,totalHInt,totalFeesPaid,total:totalCost,yearData,cycleLog,cycleCount,initialDraw,maxDraw,savingsApplied,ltvCeiling:currentHomeValue*ltv,baseline:{months:bMo,totalInt:bMInt},direct:{months:dMo,totalInt:dMInt},interestSavedVsBaseline:bMInt-totalCost,extraCostVsDirect:totalCost-dMInt};
}

const fmt=n=>"$"+Math.round(n).toLocaleString();
const fmtD=n=>"$"+Number(n).toFixed(0);
const mo=m=>`${Math.floor(m/12)}y ${m%12}mo`;
const pct=n=>n.toFixed(2)+"%";

function InfoTip({text}){
  return(<span className="tooltip" style={{marginLeft:5,cursor:"help"}}><span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:14,height:14,borderRadius:"50%",background:"#1a2235",border:"1px solid #2a3a55",fontSize:9,color:"#8899bb",fontFamily:"monospace"}}>?</span><span className="tip">{text}</span></span>);

function Label({children,tip}){

function SliderInput({label,value,min,max,step,onChange,format,hint,tip}){
  const trackRef=React.useRef(null);
  const fillRef=React.useRef(null);
  const thumbRef=React.useRef(null);
  const badgeRef=React.useRef(null);

  const calcValue=clientX=>{
    const rect=trackRef.current.getBoundingClientRect();
    const raw=((clientX-rect.left)/rect.width)*(max-min)+min;
    const stepped=Math.round(raw/step)*step;
    return Math.min(max,Math.max(min,parseFloat(stepped.toFixed(10))));
  };

  const updateDOM=v=>{
    const p=((v-min)/(max-min))*100;
    if(fillRef.current) fillRef.current.style.width=p+"%";
    if(thumbRef.current) thumbRef.current.style.left=p+"%";
    if(badgeRef.current) badgeRef.current.textContent=format(v);
  };

  const onDown=e=>{
    e.preventDefault();
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    let lastVal=calcValue(clientX);
    updateDOM(lastVal);
    const onMove=ev=>{
      ev.preventDefault();
      const cx=ev.touches?ev.touches[0].clientX:ev.clientX;
      lastVal=calcValue(cx);
      updateDOM(lastVal);
    };
    const onUp=()=>{
      onChange(lastVal);
      window.removeEventListener("mousemove",onMove);
      window.removeEventListener("mouseup",onUp);
      window.removeEventListener("touchmove",onMove);
      window.removeEventListener("touchend",onUp);
    };
    window.addEventListener("mousemove",onMove);
    window.addEventListener("mouseup",onUp);
    window.addEventListener("touchmove",onMove,{passive:false});
    window.addEventListener("touchend",onUp);
  };

  const pct=((value-min)/(max-min))*100;
  return(
    <div style={{marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,alignItems:"center"}}>
        <Label tip={tip}>{label}</Label>
        <span ref={badgeRef} style={{fontSize:13,color:"#00d4ff",fontFamily:"monospace",fontWeight:700,background:"rgba(0,212,255,0.08)",border:"1px solid rgba(0,212,255,0.2)",borderRadius:5,padding:"2px 7px"}}>{format(value)}</span>
      </div>
      <div ref={trackRef} onMouseDown={onDown} onTouchStart={onDown}
        style={{position:"relative",height:24,cursor:"grab",userSelect:"none"}}>
        <div style={{position:"absolute",top:"50%",left:0,right:0,height:4,borderRadius:2,background:"#1e2d45",transform:"translateY(-50%)"}}/>
        <div ref={fillRef} style={{position:"absolute",top:"50%",left:0,width:pct+"%",height:4,borderRadius:2,background:"#00d4ff",transform:"translateY(-50%)"}}/>
        <div ref={thumbRef} style={{position:"absolute",top:"50%",left:pct+"%",width:18,height:18,borderRadius:"50%",background:"#00d4ff",transform:"translate(-50%,-50%)",boxShadow:"0 0 0 4px rgba(0,212,255,0.25)",pointerEvents:"none"}}/>
      </div>
      {hint&&<div style={{display:"flex",justifyContent:"space-between",marginTop:2}}>
        <span style={{fontSize:9,color:"#4a5568",fontFamily:"monospace"}}>{format(min)}</span>
        <span style={{fontSize:9,color:"#4a5568",fontFamily:"monospace"}}>{hint}</span>
        <span style={{fontSize:9,color:"#4a5568",fontFamily:"monospace"}}>{format(max)}</span>
      </div>}
    </div>
  );
}
function useNumberInput(value,onChange){
  const[raw,setRaw]=useState(value===0?"":String(value));
  const isFocused=React.useRef(false);
  const userEdited=React.useRef(false);
  const lastCommitted=React.useRef(value);
  useEffect(()=>{
    // Only sync from parent if:
    // (a) user hasn't edited this field, OR
    // (b) the parent value now matches what we last committed (confirmed propagation)
    if(!userEdited.current){
      setRaw(value===0?"":String(value));
    } else if(value===lastCommitted.current){
      // Parent confirmed our committed value — safe to allow future syncs
      userEdited.current=false;
      setRaw(value===0?"":String(value));
    }
    // Otherwise: parent hasn't caught up yet — keep showing what user typed
  },[value]);
  const handleFocus=()=>{isFocused.current=true;};
  const handleChange=e=>{userEdited.current=true;setRaw(e.target.value);};
  const handleBlur=e=>{
    isFocused.current=false;
    const n=parseFloat(e.target.value.replace(/,/g,""));
    if(isNaN(n)||n<0){
      userEdited.current=false;
      lastCommitted.current=0;
      setRaw("");
      onChange(0);
    } else {
      lastCommitted.current=n;
      // Do NOT reset userEdited here — wait for parent to confirm via useEffect
      setRaw(String(n));
      onChange(n);
    }
  };
  return{raw,handleFocus,handleChange,handleBlur};
}

function RiskScenarios({baseResult,params}){
  if(!baseResult)return null;
  const scenarios=[
    {label:"Rates Rise +2%",desc:"HELOC rate increases by 2% (e.g., Prime rate rises)",mod:{helocRate:params.helocRate+2},color:C.amber},
    {label:"Rates Rise +4%",desc:"Significant rate increase — worst case environment",mod:{helocRate:params.helocRate+4},color:C.red},
    {label:"Income Drops 20%",desc:"Job loss, reduced hours, or loss of second income",mod:{monthlyIncome:params.monthlyIncome*0.8},color:C.amber},
    {label:"No Appreciation",desc:"Home value stays flat — no equity growth benefit",mod:{appreciationRate:0},color:C.textMid},
    {label:"Higher Appreciation +5%",desc:"Strong real estate market accelerates equity draws",mod:{appreciationRate:5},color:C.green},
    {label:"Larger Surplus +$1k",desc:"Extra income or reduced expenses each month",mod:{monthlyIncome:params.monthlyIncome+1000},color:C.green},
  ];
  return(<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}><div style={{padding:"18px 22px",background:C.bg,borderBottom:`1px solid ${C.border}`}}><div style={{fontSize:10,color:C.accent,fontFamily:"monospace",letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:5}}>// Risk Scenarios</div><div style={{fontSize:20,fontWeight:400,color:C.text,marginBottom:4}}>What If Things Change?</div><div style={{fontSize:13,color:C.textMid}}>See how your payoff timeline and total interest change under different conditions. HELOCs are variable rate — stress-testing matters.</div></div><div style={{overflowX:"auto"}}><table><thead><tr style={{background:C.bg}}>{["Scenario","Description","Payoff","Total Interest","vs Your Plan","Verdict"].map(h=>(<th key={h} style={{padding:"10px 14px",textAlign:"left",fontSize:9,color:C.textDim,fontFamily:"monospace",letterSpacing:"0.04em",textTransform:"uppercase",fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>))}</tr></thead><tbody><tr style={{background:C.accentGlow}}><td style={{padding:"10px 14px",fontFamily:"monospace",fontSize:12,color:C.accent,fontWeight:700}}>Your Current Plan</td><td style={{padding:"10px 14px",fontSize:12,color:C.textMid}}>Base scenario</td><td style={{padding:"10px 14px",fontFamily:"monospace",fontSize:12,color:C.text}}>{mo(baseResult.months)}</td><td style={{padding:"10px 14px",fontFamily:"monospace",fontSize:12,color:C.text}}>{fmt(baseResult.total)}</td><td style={{padding:"10px 14px",fontFamily:"monospace",fontSize:12,color:C.textDim}}>—</td><td style={{padding:"10px 14px"}}><span style={{fontSize:10,fontFamily:"monospace",color:C.accent,background:C.accentGlow,padding:"2px 8px",borderRadius:10}}>BASELINE</span></td></tr>{scenarios.map((s,i)=>{const sr=simulate({...params,...s.mod});if(!sr)return null;const moDiff=sr.months-baseResult.months;const costDiff=sr.total-baseResult.total;const worse=moDiff>6||costDiff>5000;const better=moDiff<-3||costDiff<-2000;return(<tr key={i} style={{borderBottom:`1px solid ${C.border}`}}><td style={{padding:"10px 14px",fontFamily:"monospace",fontSize:12,color:s.color,fontWeight:700}}>{s.label}</td><td style={{padding:"10px 14px",fontSize:12,color:C.textMid}}>{s.desc}</td><td style={{padding:"10px 14px",fontFamily:"monospace",fontSize:12,color:C.text}}>{mo(sr.months)}</td><td style={{padding:"10px 14px",fontFamily:"monospace",fontSize:12,color:C.text}}>{fmt(sr.total)}</td><td style={{padding:"10px 14px",fontFamily:"monospace",fontSize:12,color:costDiff>0?C.red:C.green}}>{costDiff>0?"+":""}{fmt(costDiff)}</td><td style={{padding:"10px 14px"}}><span style={{fontSize:10,fontFamily:"monospace",color:worse?C.red:better?C.green:C.textMid,background:worse?C.redDim:better?C.greenDim:"transparent",padding:"2px 8px",borderRadius:10}}>{worse?"⚠ WATCH":better?"✓ BETTER":"SIMILAR"}</span></td></tr>);})}</tbody></table></div><div style={{padding:"12px 20px",background:C.bg,borderTop:`1px solid ${C.border}`,fontSize:11,color:C.textDim,lineHeight:1.6}}><strong style={{color:C.textMid}}>Key insight:</strong> The strategy is most vulnerable to rate increases AND income drops happening simultaneously. If both occur, consider pausing redraws and just letting income pay down the HELOC without drawing new equity until conditions improve.</div></div>);
}

function BreakevenChart({result}){
  if(!result)return null;
  const breakeven=result.yearData.findIndex(y=>y.savedVsNothing>0);
  return(<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}><div style={{padding:"16px 20px",background:C.bg,borderBottom:`1px solid ${C.border}`}}><div style={{fontSize:10,color:C.accent,fontFamily:"monospace",letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:4}}>// Break-Even Timeline</div><div style={{fontSize:18,fontWeight:400,color:C.text,marginBottom:6}}>Cumulative Interest: Velocity Banking vs Doing Nothing</div><div style={{fontSize:13,color:C.textMid,lineHeight:1.7}}>Each bar shows the <strong style={{color:C.text}}>running difference</strong> in total interest paid compared to doing nothing (standard amortization). <span style={{color:C.red}}>Red = velocity banking has cost more so far</span> (because HELOC interest was front-loaded early). <span style={{color:C.green}}>Green = you're now ahead</span> — every month after break-even is pure savings. The final green bar is your total lifetime interest savings.</div></div><div style={{padding:"18px 20px"}}>{result.yearData.map((y,i)=>{const maxSaved=Math.max(1,...result.yearData.map(d=>Math.abs(d.savedVsNothing)));const barWidth=Math.abs(y.savedVsNothing)/maxSaved*100;const isPositive=y.savedVsNothing>=0;const isBreakeven=i===breakeven;return(<div key={i} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3,alignItems:"center"}}><span style={{fontFamily:"monospace",fontSize:11,color:isBreakeven?C.amber:C.textMid}}>{y.partial?`Yr ${y.year}*`:`Year ${y.year}`}{isBreakeven?" ← BREAK-EVEN":""}</span><span style={{fontFamily:"monospace",fontSize:11,color:isPositive?C.green:C.red,fontWeight:700}}>{isPositive?"+":""}{fmt(y.savedVsNothing)}</span></div><div style={{height:8,background:C.bg,borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",borderRadius:4,background:isPositive?`linear-gradient(90deg,${C.green}88,${C.green})`:C.red+"66",width:`${Math.min(100,barWidth)}%`,transition:"width 0.3s"}}/></div></div>);})}<div style={{marginTop:14,padding:"12px 14px",background:C.bg,borderRadius:8,fontSize:13,color:C.textMid,lineHeight:1.7}}>
  {breakeven<0
    ?<span style={{color:C.red}}>⚠ Strategy doesn't break even before payoff. The HELOC interest exceeds savings in this scenario. Try reducing the chunk size percentage.</span>
    :<>
      <span style={{color:C.green,fontWeight:700}}>✓ Break-even in Year {result.yearData[breakeven]?.year}.</span>
      {" "}Before that year, the HELOC's upfront interest costs slightly more cumulatively. After that year, every single month adds to your savings column. Final lifetime advantage: <span style={{color:C.green,fontWeight:700}}>{fmt(result.interestSavedVsBaseline)}</span>.
      <div style={{marginTop:8,fontSize:12,color:C.textDim}}>Note: "Savings vs doing nothing" means the difference between total interest you would have paid on the standard 30-year amortization schedule vs total interest (mortgage + HELOC) under this strategy. It does NOT account for any difference in payoff date — the mortgage is eliminated years earlier, which is itself a major financial win not captured in this single number.</div>
    </>
  }
</div></div></div>);
}

function LTVVisual({homeValue,mortgageBal,ltvLimit}){
  const ltv=ltvLimit/100;const ceiling=homeValue*ltv;const available=Math.max(0,ceiling-mortgageBal);const currentLTV=Math.min(100,mortgageBal/homeValue*100);
  return(<div style={{background:C.bg,borderRadius:8,border:`1px solid ${C.border}`,padding:14,marginTop:4}}><div style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:10,color:C.textDim,fontFamily:"monospace"}}>Current LTV: <span style={{color:currentLTV>ltvLimit?C.red:C.green,fontWeight:700}}>{currentLTV.toFixed(1)}%</span></span><span style={{fontSize:10,color:C.textDim,fontFamily:"monospace"}}>Limit: {ltvLimit}%</span></div><div style={{height:8,background:C.surface,borderRadius:4,overflow:"hidden",position:"relative"}}><div style={{position:"absolute",height:"100%",borderRadius:4,background:`linear-gradient(90deg,${C.green},${C.accent})`,width:`${currentLTV}%`,transition:"width 0.3s",maxWidth:"100%"}}/><div style={{position:"absolute",height:"100%",width:2,background:C.amber,left:`${ltvLimit}%`,top:0}}/></div><div style={{display:"flex",justifyContent:"space-between",marginTop:3}}><span style={{fontSize:9,color:C.textDim,fontFamily:"monospace"}}>0%</span><span style={{fontSize:9,color:C.amber,fontFamily:"monospace"}}>{ltvLimit}% limit</span><span style={{fontSize:9,color:C.textDim,fontFamily:"monospace"}}>100%</span></div></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>{[["Home Value",fmt(homeValue),C.textMid],[`${ltvLimit}% Ceiling`,fmt(ceiling),C.accent],["Available HELOC",available>0?fmt(available):"None",available>0?C.green:C.red]].map(([l,v,c])=>(<div key={l} style={{textAlign:"center",background:C.surface,borderRadius:6,padding:"8px 4px"}}><div style={{fontSize:9,color:C.textDim,fontFamily:"monospace",textTransform:"uppercase",marginBottom:3}}>{l}</div><div style={{fontSize:12,fontFamily:"monospace",color:c,fontWeight:700}}>{v}</div></div>))}</div>{available<=0&&<div style={{marginTop:8,fontSize:10,color:C.red,fontFamily:"monospace",textAlign:"center",lineHeight:1.5}}>⚠ Not enough equity at {ltvLimit}% LTV. Adjust your home value or LTV limit.</div>}</div>);
}

function StrategyExplainer({redrawPct,surplus,result,params,useRentalHeloc}){
  const tier=redrawPct<=0.25?"conservative":redrawPct<=0.50?"moderate":redrawPct<=0.75?"aggressive":"maximum";
  const tierColor={conservative:C.green,moderate:C.accent,aggressive:C.amber,maximum:C.red}[tier];
  const tips={
    conservative:"Smaller chunks, more cycles. HELOC balance stays low each cycle — less daily interest. Best when your HELOC rate is significantly higher than your mortgage rate.",
    moderate:"Balanced approach. Fewer cycles with moderately sized draws. Works well for most situations.",
    aggressive:"Larger chunks reduce cycle count but carry a bigger HELOC balance for longer — more daily interest accumulates.",
    maximum:"Maximum draw each cycle. Only meaningfully different if your approved HELOC limit is very large relative to remaining balance."
  };

  // The approved HELOC line limit (lineCap) = helocCap if set, else maxDraw at origination
  // This is the real ceiling on every draw — not just a percentage of equity
  // The slider only changes results when ceiling*pct < lineCap AND ceiling*pct < mBal
  // Above the point where ceiling*pct hits lineCap, all higher % values are identical
  const lineCap=result?result.initialDraw:0; // initialDraw = min(maxDraw, lineCap, mortgageBal)
  
  // Find the first redraw cycle to compute effective cap
  const firstRedraw=result&&result.cycleLog.length>1?result.cycleLog[1]:null;
  const effectivePct=firstRedraw&&firstRedraw.ceiling>0
    ?Math.round(lineCap/firstRedraw.ceiling*100)
    :null;
  const atCap=effectivePct!==null&&Math.round(redrawPct*100)>=effectivePct;

  // What would the actual next draw be?
  const nextDrawEst=firstRedraw&&firstRedraw.ceiling>0
    ?Math.min(firstRedraw.ceiling*redrawPct, lineCap)
    :null;

  return(
    <div style={{background:C.bg,borderRadius:8,border:`1px solid ${C.border}`,padding:14,marginTop:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontFamily:"monospace",fontSize:11,color:C.textMid,textTransform:"uppercase",letterSpacing:"0.08em"}}>Setting: <span style={{color:tierColor,fontWeight:700}}>{tier}</span></span>
        {result&&<span style={{fontFamily:"monospace",fontSize:11,color:C.textDim}}>{result.cycleCount} cycle{result.cycleCount!==1?"s":""} · ~{Math.round(result.months/result.cycleCount)}mo each</span>}
      </div>
      <div style={{fontSize:12,color:C.textMid,lineHeight:1.6,marginBottom:10}}>{tips[tier]}</div>
      {result&&<div style={{background:C.surface,borderRadius:6,padding:"10px 12px",marginBottom:10,lineHeight:1.6,border:`1px solid ${atCap?C.amber+"55":C.border}`}}>
        {atCap
          ?<div style={{fontSize:12,color:C.amber}}>
            ⚠ <strong>Setting above {effectivePct}% has no additional effect.</strong> Your approved HELOC limit is {fmt(lineCap)} — the actual draw is capped there regardless of this setting. Move the slider to {effectivePct-5}% or below to see real differences in interest paid and cycle count.
           </div>
          :<div style={{fontSize:12,color:C.textDim}}>
            {nextDrawEst?<>Each redraw will draw approximately <strong style={{color:C.accent}}>{fmt(nextDrawEst)}</strong> onto the mortgage (capped by your {fmt(lineCap)} HELOC limit). Increase % to draw more per cycle — decrease % to keep HELOC balances smaller and pay less daily interest.</>
            :<>Adjust to control how much equity gets chunked onto the mortgage each cycle.</>}
            {effectivePct!==null&&<> Settings above <strong>{effectivePct}%</strong> hit your line limit and are equivalent.</>}
           </div>
        }
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        <div style={{background:C.surface,borderRadius:6,padding:"8px 10px"}}>
          <div style={{fontSize:9,color:C.textDim,fontFamily:"monospace",textTransform:"uppercase",marginBottom:2}}>Monthly Surplus</div>
          <div style={{fontSize:14,fontFamily:"monospace",color:surplus>0?C.green:C.red,fontWeight:700}}>{fmt(surplus)}</div>
          <div style={{fontSize:9,color:C.textDim,marginTop:1}}>{useRentalHeloc?"incl. rental cash flow":"net HELOC paydown/mo"}</div>
        </div>
        <div style={{background:C.surface,borderRadius:6,padding:"8px 10px"}}>
          <div style={{fontSize:9,color:C.textDim,fontFamily:"monospace",textTransform:"uppercase",marginBottom:2}}>Chunking Cycles</div>
          <div style={{fontSize:14,fontFamily:"monospace",color:C.accent,fontWeight:700}}>{result?result.cycleCount:"—"}</div>
          <div style={{fontSize:9,color:C.textDim,marginTop:1}}>equity draws onto mortgage</div>
        </div>
        <div style={{background:C.surface,borderRadius:6,padding:"8px 10px"}}>
          <div style={{fontSize:9,color:C.textDim,fontFamily:"monospace",textTransform:"uppercase",marginBottom:2}}>HELOC Interest</div>
          <div style={{fontSize:14,fontFamily:"monospace",color:C.amber,fontWeight:700}}>{result?fmt(result.totalHInt):"—"}</div>
          <div style={{fontSize:9,color:C.textDim,marginTop:1}}>total cost of HELOC</div>
        </div>
      </div>
    </div>
  );
}

    </div>
  );
}

function plainEnglishRow(y,prevY,cycleLog){
  const hasCycle=cycleLog.some(c=>c.month>0&&Math.floor((c.month-1)/12)===y.year-1);
  const mortgageDrop=prevY?prevY.mBal-y.mBal:0;
  const parts=[];
  if(hasCycle)parts.push(`🔄 Redraw cycle — lump sum applied to mortgage`);
  if(y.mBal===0&&prevY&&prevY.mBal>0)parts.push(`🎉 Mortgage fully paid off!`);
  else if(mortgageDrop>15000)parts.push(`Mortgage dropped ${fmt(mortgageDrop)}`);
  if(y.yrHInt>y.yrMInt)parts.push(`HELOC interest exceeded mortgage interest this year`);
  if(y.savedVsNothing>0&&(!prevY||prevY.savedVsNothing<=0))parts.push(`✓ Strategy now ahead of doing nothing`);
  return parts.join(" · ")||"Steady progress — HELOC paying down from monthly surplus";
}

          {[["calculator","🧮 Calculator"],["results","📊 Results"],["risk","⚠️ Risk"]].map(([key,label])=>(
            <button key={key} onClick={()=>setActiveSection(key)} style={{flex:1,padding:"16px 8px",background:"transparent",border:"none",borderBottom:`3px solid ${activeSection===key?C.accent:"transparent"}`,cursor:"pointer",fontFamily:"monospace",fontSize:12,color:activeSection===key?C.accent:C.textMid,letterSpacing:"0.05em",textTransform:"uppercase",transition:"all 0.15s",whiteSpace:"nowrap"}}>{label}</button>
          ))}
          <div style={{width:1,background:C.border,margin:"10px 0"}}/>
          {[["learn","📖 How It Works"],["lender","🏦 Checklists"],["faq","❓ FAQ"]].map(([key,label])=>(
            <button key={key} onClick={()=>setActiveSection(key)} style={{flex:1,padding:"16px 8px",background:"transparent",border:"none",borderBottom:`3px solid ${activeSection===key?C.accent:"transparent"}`,cursor:"pointer",fontFamily:"monospace",fontSize:12,color:activeSection===key?C.accent:C.textMid,letterSpacing:"0.05em",textTransform:"uppercase",transition:"all 0.15s",whiteSpace:"nowrap"}}>{label}</button>
          ))}
        </div>
      </div>

      <div style={{maxWidth:1400,margin:"0 auto",padding:"28px 28px"}}>

        {activeSection==="learn"&&<div className="fade-in" style={{display:"flex",flexDirection:"column",gap:20}}><HowItWorks/><WhoIsThisFor/></div>}
        {activeSection==="lender"&&<div className="fade-in"><LenderChecklist/><RealtorChecklist/></div>}
        {activeSection==="risk"&&<div className="fade-in" style={{display:"flex",flexDirection:"column",gap:20}}><RiskScenarios baseResult={result} params={params}/><BreakevenChart result={result}/></div>}
        {activeSection==="faq"&&<div className="fade-in"><FaqSection/></div>}

        {activeSection==="calculator"&&<div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,alignItems:"start"}}>

          {/* ── LEFT PANEL ── */}
          <div>

            {/* helper */}
            {(()=>{
              const Accordion=({id,title,summary,children})=>{
                const open=!!openSections[id];
                return(
                  <div style={{background:C.surface,border:`1px solid ${open?C.accent+"55":C.border}`,borderRadius:12,marginBottom:12,overflow:"hidden",transition:"border-color 0.2s"}}>
                    <button onClick={()=>toggleSection(id)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 18px",background:"transparent",border:"none",cursor:"pointer",textAlign:"left",gap:10}}>
                      <span style={{fontSize:12,color:open?C.accent:C.text,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:700}}>{title}</span>
                      <span style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
                        {!open&&summary&&<span style={{fontSize:11,color:C.textDim,fontFamily:"monospace"}}>{summary}</span>}
                        <span style={{color:open?C.accent:C.textDim,fontSize:18,fontFamily:"monospace",transition:"transform 0.2s",display:"inline-block",transform:open?"rotate(0deg)":"rotate(-90deg)"}}>▾</span>
                      </span>
                    </button>
                    <div className={`accordion-body ${open?"open":"closed"}`} style={{padding:"0 18px",borderTop:open?`1px solid ${C.border}`:"none"}}><div style={{paddingTop:4,paddingBottom:18}}>{children}</div></div>
                  </div>
                );
              };
              const TI=({label,mode,setMode,monthly,setMonthly,annual,setAnnual,tip})=>(
                <div style={{marginBottom:14}}>
                  <Label tip={tip}>{label}</Label>
                  {/* Mode selector — full width, hard to miss */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:8}}>
                    {[
                      {v:"monthly", l:"Monthly",  icon:"📅", hint:"per month"},
                      {v:"annual",  l:"Annual",   icon:"📆", hint:"per year"},
                      {v:"escrow",  l:"In Escrow",icon:"✓",  hint:"in mortgage pmt"},
                    ].map(({v,l,icon,hint})=>(
                      <button key={v} onClick={()=>setMode(v)} style={{
                        padding:"8px 6px",borderRadius:7,cursor:"pointer",textAlign:"center",
                        border:`2px solid ${mode===v?C.accent:C.border}`,
                        background:mode===v?C.accent+"18":C.bg,
                        transition:"all 0.15s"
                      }}>
                        <div style={{fontSize:14,marginBottom:2}}>{icon}</div>
                        <div style={{fontSize:11,fontWeight:700,fontFamily:"monospace",color:mode===v?C.accent:C.textMid}}>{l}</div>
                        <div style={{fontSize:9,color:mode===v?C.accent:C.textDim,fontFamily:"monospace"}}>{hint}</div>
                      </button>
                    ))}
                  </div>
                  {mode!=="escrow"&&(
                    <div>
                      <div style={{position:"relative"}}>
                        <DollarInput value={mode==="annual"?annual:monthly} onChange={n=>{mode==="annual"?setAnnual(n):setMonthly(n);}} suffix={mode==="annual"?"/ year":"/ month"}/>
                      </div>
                      {mode==="annual"
                        ?<div style={{fontSize:11,color:C.accent,marginTop:5,fontFamily:"monospace",display:"flex",alignItems:"center",gap:4}}>
                           <span>📅</span> = {fmt(annual/12)}/mo used in calculation
                         </div>
                        :<div style={{fontSize:11,color:C.textDim,marginTop:5,fontFamily:"monospace"}}>
                           📅 monthly amount used in calculation
                         </div>
                      }
                    </div>
                  )}
                  {mode==="escrow"&&<div style={{fontSize:11,color:C.textDim,lineHeight:1.6,background:C.bg,borderRadius:6,padding:"8px 10px"}}>✓ Already included in your total mortgage payment above — no separate entry needed.</div>}
                </div>
              );

              const mortgageSummary=mortgageBal>0?`${fmt(mortgageBal)} @ ${mortgageRate}%`:null;
              const helocSummary=`${helocRate}% · ${ltvLimit}% LTV`;
              const incomeSummary=monthlyIncome>0?fmt(monthlyIncome):null;
              const expenseSummary=livingExpenses>0?fmt(livingExpenses):null;

              return(<>

              {/* ── MORTGAGE ── */}
              <Accordion id="mortgage" title="🏠 Mortgage Details" summary={mortgageSummary}>
                <NumInput label="Current Mortgage Balance" value={mortgageBal} onChange={setMortgageBal} tip="The remaining principal you owe — find it on your monthly statement."/>
                <SliderInput label="Interest Rate" value={mortgageRate} min={2} max={9} step={0.05} onChange={setMortgageRate} format={v=>v.toFixed(2)+"%"} hint="US 30yr fixed avg ~6.8% as of 2025" tip="Your annual mortgage rate. Check your loan documents."/>

                {/* Payment mode */}
                <div style={{marginBottom:14}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:7}}>
                    <span style={{fontSize:12,color:C.textMid}}>Monthly Payment</span>
                    <div style={{display:"flex",background:C.bg,border:`1px solid ${C.border}`,borderRadius:5,overflow:"hidden"}}>
                      {[["pi","P+I only"],["total","Total w/ escrow"]].map(([v,l])=>(
                        <button key={v} onClick={()=>setPmtMode(v)} style={{padding:"3px 9px",background:pmtMode===v?C.accent:"transparent",color:pmtMode===v?C.bg:C.textDim,border:"none",cursor:"pointer",fontFamily:"monospace",fontSize:10,fontWeight:pmtMode===v?700:400}}>{l}</button>
                      ))}
                    </div>
                  </div>
                  <DollarInput value={pmtMode==="total"?totalPmt:mortgagePmt} onChange={n=>{pmtMode==="total"?setTotalPmt(n):setMortgagePmt(n);}} suffix="/mo"/>
                  {pmtMode==="pi"&&<div style={{fontSize:10,color:C.textDim,marginTop:4}}>Principal + interest only. Find the P+I line on your statement — not the total if tax/insurance are escrowed.</div>}
                  {pmtMode==="total"&&<div style={{fontSize:10,color:C.textDim,marginTop:4}}>Full payment including escrow. P+I calculated: <span style={{color:C.accent,fontWeight:700}}>{fmt(piOnly)}</span> (after subtracting T&I below)</div>}
                </div>

                {/* Property Tax */}
                <TI
                  label="Property Tax"
                  mode={propTaxMode} setMode={setPropTaxMode}
                  monthly={propTaxMonthly} setMonthly={setPropTaxMonthly}
                  annual={propTaxAnnual} setAnnual={setPropTaxAnnual}
                  tip="Your annual property tax divided by 12 if paying monthly, or your annual bill. Select 'In escrow' if it's already bundled into your mortgage payment above."
                />

                {/* Home Insurance */}
                <TI
                  label="Home Insurance"
                  mode={insurMode} setMode={setInsurMode}
                  monthly={insurMonthly} setMonthly={setInsurMonthly}
                  annual={insurAnnual} setAnnual={setInsurAnnual}
                  tip="Homeowner's insurance premium. Select 'In escrow' if already bundled into your mortgage payment."
                />

                <div style={{marginBottom:18}}>
                  <Label tip="The month and year your mortgage is scheduled to be paid off.">Loan End Date</Label>
                  <div style={{display:"flex",gap:8,marginTop:6}}>
                    <select value={endMonth} onChange={e=>setEndMonth(Number(e.target.value))}
                      style={{flex:1,background:"#0d1f35",color:"#e2e8f0",border:"1px solid #1e3a5f",borderRadius:6,padding:"6px 8px",fontSize:14}}>
                      {["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map((m,i)=>(
                        <option key={i} value={i+1}>{m}</option>
                      ))}
                    </select>
                    <select value={endYear} onChange={e=>setEndYear(Number(e.target.value))}
                      style={{flex:2,background:"#0d1f35",color:"#e2e8f0",border:"1px solid #1e3a5f",borderRadius:6,padding:"6px 8px",fontSize:14}}>
                      {Array.from({length:36},(_,i)=>new Date().getFullYear()+i).map(y=>(
                        <option key={y} value={y}>{y}</option>
                      ))}
                    </select>
                  </div>
                  <div style={{marginTop:4,fontSize:11,color:"#4a9eff",fontFamily:"monospace"}}>{remainingYears} year{remainingYears!==1?"s":""} remaining</div>
                </div>
                <NumInput label="Current Home Value" value={homeValue} onChange={setHomeValue} tip="Use Zillow, Redfin, or a recent appraisal. Lenders will appraise independently before issuing a HELOC."/>

                <div style={{background:C.bg,borderRadius:8,border:`1px solid ${C.border}`,padding:"10px 12px",marginTop:4}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                    <span style={{fontSize:11,color:C.textMid,fontFamily:"monospace"}}>Total monthly housing cost</span>
                    <span style={{fontSize:14,fontFamily:"monospace",color:C.amber,fontWeight:700}}>{fmt(piOnly+taxInsurance)}</span>
                  </div>
                  <div style={{fontSize:10,color:C.textDim}}>P+I {fmt(piOnly)}{propTax>0?` + Tax ${fmt(propTax)}`:""}{homeInsur>0?` + Insurance ${fmt(homeInsur)}`:""}{(propTaxMode==="escrow"||insurMode==="escrow")?" (some in escrow)":""}</div>
                </div>
              </Accordion>

              {/* ── HELOC ── */}
              <Accordion id="heloc" title="🏦 HELOC Settings" summary={helocSummary}>
                <SliderInput label="HELOC Interest Rate" value={helocRate} min={4} max={13} step={0.25} onChange={setHelocRate} format={v=>v.toFixed(2)+"%"} hint="Usually Prime + 0–2%. Credit unions often lower." tip="The single most important input. A lower HELOC rate dramatically improves the strategy. Shop at least 3 lenders — especially local credit unions — before accepting any offer."/>
                <NumInput label="HELOC Line Limit (optional)" value={helocCap} onChange={setHelocCap} tip="What your lender actually approves. Leave at $0 to use full available equity. Set this if your bank caps the line at a specific amount — e.g. $50,000 even though your equity supports more. This cap applies to every draw, not just the first." prefix="$"/>
                {helocCap>0&&result&&<div style={{fontSize:11,color:C.amber,marginTop:-10,marginBottom:12,lineHeight:1.5}}>⚠ Line capped at {fmt(helocCap)}. Your available equity is {fmt(Math.max(0,homeValue*ltvLimit/100-mortgageBal))} — lender is limiting the line below full equity.</div>}
                <SliderInput label="LTV Limit" value={ltvLimit} min={60} max={90} step={5} onChange={setLtvLimit} format={v=>v+"%"} hint="80% is standard. Some credit unions offer 85–90%." tip="Your mortgage + HELOC combined can't exceed this % of home value. Ask each lender — it varies."/>
                <SliderInput label="Home Appreciation Rate" value={appreciationRate} min={0} max={8} step={0.5} onChange={setAppreciationRate} format={v=>v.toFixed(1)+"%/yr"} hint="US avg ~3–4%/yr. High-growth markets 5–7%." tip="As your home appreciates, your HELOC ceiling grows each cycle. Set to 0% for a conservative scenario."/>
                <LTVVisual homeValue={homeValue} mortgageBal={mortgageBal} ltvLimit={ltvLimit}/>
                <div style={{marginTop:14,borderTop:`1px solid ${C.border}`,paddingTop:12}}>
                  <button onClick={()=>setShowHelocFees(f=>!f)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",background:"transparent",border:"none",cursor:"pointer",padding:0,marginBottom:showHelocFees?10:0}}>
                    <span style={{fontSize:11,color:C.textDim,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:"0.08em"}}>HELOC Fees <InfoTip text="Most lenders charge $0–$500 to open and $0–$100/yr annually. Many credit unions waive entirely — always ask."/></span>
                    <span style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:11,fontFamily:"monospace",color:helocOrigination+helocAnnual>0?C.amber:C.textDim}}>{helocOrigination+helocAnnual===0?"$0 — tap to edit":`${fmt(helocOrigination)} + ${fmt(helocAnnual)}/yr`}</span>
                      <span style={{color:C.textDim,fontSize:14,fontFamily:"monospace",transform:showHelocFees?"rotate(0)":"rotate(-90deg)",transition:"transform 0.2s",display:"inline-block"}}>▾</span>
                    </span>
                  </button>
                  {showHelocFees&&(
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                      <NumInput label="Origination / Closing" value={helocOrigination} onChange={setHelocOrigination} tip="One-time fee. $0–$500+ typically. Many credit unions waive entirely."/>
                      <NumInput label="Annual Fee" value={helocAnnual} onChange={setHelocAnnual} tip="Yearly fee to keep the line open. $0–$100 typically."/>
                    </div>
                  )}
                </div>
              </Accordion>

              {/* ── INCOME ── */}
              <Accordion id="income" title="💰 Monthly Income" summary={incomeSummary}>
                <div style={{fontSize:11,color:C.textDim,marginBottom:14,lineHeight:1.5}}>After-tax take-home only. This is what flows into the HELOC on paydays — being accurate here is critical.</div>
                <ExpenseRow label="Primary income (salary / wages)" value={primaryIncome} onChange={setPrimaryIncome} tip="Your main job's monthly take-home after all taxes and deductions."/>
                <ExpenseRow label="Secondary income (spouse / partner)" value={secondaryIncome} onChange={setSecondaryIncome} tip="Second earner's take-home. Zero if single income."/>
                <ExpenseRow label="Other (rental, side, etc.)" value={otherIncome} onChange={setOtherIncome} tip="Rental income, freelance, business distributions. Only reliably recurring amounts."/>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,padding:"10px 12px",background:C.bg,borderRadius:8,border:`1px solid ${C.border}`}}>
                  <span style={{fontSize:11,color:C.textMid,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:"0.06em"}}>Total Monthly Income</span>
                  <span style={{fontSize:17,fontFamily:"monospace",fontWeight:700,color:C.green}}>{fmt(monthlyIncome)}</span>
                </div>
              </Accordion>

              {/* ── EXPENSES ── */}
              <Accordion id="expenses" title="📋 Monthly Expenses" summary={expenseSummary}>
                <div style={{fontSize:11,color:C.textDim,marginBottom:14,lineHeight:1.5}}>Exclude your mortgage. The #1 reason velocity banking fails is an overestimated surplus — use your last 3 months of statements.</div>
                <div style={{display:"flex",background:C.bg,border:`1px solid ${C.border}`,borderRadius:7,overflow:"hidden",marginBottom:14}}>
                  {[["simple","One total"],["detailed","By category"]].map(([v,lbl])=>(
                    <button key={v} onClick={()=>setExpenseMode(v)} style={{flex:1,padding:"8px 0",background:expenseMode===v?C.accent:"transparent",color:expenseMode===v?C.bg:C.textMid,border:"none",cursor:"pointer",fontFamily:"monospace",fontSize:11,fontWeight:expenseMode===v?700:400,transition:"all 0.15s"}}>{lbl}</button>
                  ))}
                </div>
                {expenseMode==="simple"?(
                  <div>
                    <ExpenseRow label="Total monthly expenses (excl. mortgage)" value={totalExpensesSimple} onChange={setTotalExpensesSimple} tip="Everything except your mortgage — debt payments, food, utilities, transport, subscriptions, etc."/>
                    <div style={{fontSize:10,color:C.textDim,marginTop:4,lineHeight:1.6}}>Switch to "By category" to make sure nothing is forgotten.</div>
                  </div>
                ):(
                  <div>
                    {expenseGroups.map((group,gi)=>{
                      const groupTotal=group.rows.reduce((s,r)=>s+r.value,0);
                      const isOpen=!!openGroups[group.label];
                      return(
                        <div key={gi} style={{marginBottom:8,background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,overflow:"hidden"}}>
                          <button onClick={()=>toggleGroup(group.label)} style={{width:"100%",display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"transparent",border:"none",cursor:"pointer",textAlign:"left"}}>
                            <div style={{width:3,height:14,background:group.color,borderRadius:2,flexShrink:0}}/>
                            <span style={{fontSize:11,color:group.color,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:700,flex:1}}>{group.label}</span>
                            {group.tip&&<InfoTip text={group.tip}/>}
                            <span style={{fontSize:12,fontFamily:"monospace",color:groupTotal>0?C.textMid:C.textDim,marginRight:8}}>{fmt(groupTotal)}</span>
                            <span style={{fontSize:14,color:C.textDim,fontFamily:"monospace",transform:isOpen?"rotate(0)":"rotate(-90deg)",transition:"transform 0.2s",display:"inline-block"}}>▾</span>
                          </button>
                          {isOpen&&(
                            <div style={{padding:"4px 12px 12px",borderTop:`1px solid ${C.border}`}}>
                              {group.rows.map((row,ri)=>(
                                <ExpenseRow key={ri} label={row.label} value={row.value} onChange={row.set} tip={row.tip}/>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
                <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12,marginTop:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:11,color:C.textMid,fontFamily:"monospace"}}>Total non-mortgage expenses</span>
                  <span style={{fontSize:14,fontFamily:"monospace",fontWeight:700,color:C.amber}}>{fmt(livingExpenses)}</span>
                </div>
              </Accordion>

              {/* ── STARTING CAPITAL ── */}
              <Accordion id="savings" title="🏦 Starting Capital" summary={savings>0?fmt(savings):null}>
                <NumInput label="Savings to Deploy Day 1" value={savings} onChange={setSavings} tip="Cash you'll deposit into the HELOC when you open it. Every dollar reduces your starting balance and early interest. It stays accessible — you're not spending it."/>
              </Accordion>

              {/* ── RENTAL PROPERTY (optional) ── */}
              <div style={{background:C.surface,border:`1px solid ${useRentalHeloc?C.amber+"66":C.border}`,borderRadius:12,marginBottom:12,overflow:"hidden",transition:"border-color 0.2s"}}>
                <button onClick={()=>setUseRentalHeloc(v=>!v)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 18px",background:"transparent",border:"none",cursor:"pointer",textAlign:"left",gap:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:12,color:useRentalHeloc?C.amber:C.text,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:700}}>🏘 Rental / Investment Property HELOC</span>
                    <span style={{fontSize:10,color:useRentalHeloc?C.amber:C.textDim,fontFamily:"monospace",padding:"2px 8px",borderRadius:10,background:useRentalHeloc?C.amber+"22":"transparent",border:`1px solid ${useRentalHeloc?C.amber+"44":"transparent"}`}}>{useRentalHeloc?"ENABLED":"optional"}</span>
                  </div>
                  <span style={{color:useRentalHeloc?C.amber:C.textDim,fontSize:18,fontFamily:"monospace",transition:"transform 0.2s",display:"inline-block",transform:useRentalHeloc?"rotate(0deg)":"rotate(-90deg)"}}>▾</span>
                </button>
                <div className={`accordion-body ${useRentalHeloc?"open":"closed"}`} style={{padding:"0 18px",borderTop:useRentalHeloc?`1px solid ${C.border}`:"none"}}>
                  <div style={{paddingTop:12,paddingBottom:18}}>

                    {/* ── Direction selector ── */}
                    <div style={{marginBottom:16}}>
                      <div style={{fontSize:11,color:C.textDim,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Which direction?</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                        {[
                          {id:"heloc_on_rental",  icon:"🏘→🏠", title:"HELOC on rental", desc:"Borrow against your rental property equity to pay down your primary home mortgage"},
                          {id:"heloc_on_primary", icon:"🏠→🏘", title:"HELOC on primary home", desc:"Borrow against your primary home equity to pay down your rental property mortgage"},
                        ].map(opt=>(
                          <button key={opt.id} onClick={()=>setRentalDirection(opt.id)}
                            style={{padding:"12px 14px",borderRadius:8,border:`2px solid ${rentalDirection===opt.id?C.amber:C.border}`,background:rentalDirection===opt.id?C.amber+"11":C.bg,cursor:"pointer",textAlign:"left",transition:"all 0.15s"}}>
                            <div style={{fontSize:16,marginBottom:4}}>{opt.icon}</div>
                            <div style={{fontSize:12,fontWeight:700,color:rentalDirection===opt.id?C.amber:C.text,fontFamily:"monospace",marginBottom:4}}>{opt.title}</div>
                            <div style={{fontSize:11,color:C.textDim,lineHeight:1.5}}>{opt.desc}</div>
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* ── Direction A: HELOC on rental → pay primary ── */}
                    {rentalDirection==="heloc_on_rental"&&<>
                      <div style={{background:C.amber+"11",border:`1px solid ${C.amber}33`,borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:C.amber,lineHeight:1.6}}>
                        You own a rental/investment property with equity. You'll open a HELOC on that property and use those funds to pay down your primary residence mortgage. Rental property HELOCs typically have higher rates and lower LTV limits than primary residence HELOCs.
                      </div>
                      <NumInput label="Rental Property Value" value={rentalHomeValue} onChange={setRentalHomeValue} tip="Current market value of the rental/investment property you'll borrow against."/>
                      <NumInput label="Rental Mortgage Balance (if any)" value={rentalMortgageBal} onChange={setRentalMortgageBal} tip="Outstanding mortgage on the rental property. Enter 0 if paid off — more equity available."/>
                      <NumInput label="Rental Mortgage Payment (if any)" value={rentalMortgagePmt} onChange={setRentalMortgagePmt} tip="Monthly payment on the rental mortgage. This flows through the HELOC as a monthly expense alongside your primary mortgage payment."/>
                      <ExpenseRow label="Monthly Rental Income" value={rentalIncome} onChange={setRentalIncome} tip="Net rent you collect each month. Deposits into the HELOC alongside your paycheck, accelerating paydown."/>
                      <div style={{marginBottom:14}}>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                          <Label tip="Investment property HELOCs typically run 0.5–2% higher than primary residence rates.">Rental HELOC Rate</Label>
                          <span style={{fontSize:12,color:C.amber,fontFamily:"monospace"}}>{rentalHelocRate>0?rentalHelocRate.toFixed(2)+"%":"default: "+((helocRate+0.5)).toFixed(2)+"%"}</span>
                        </div>
                        <SliderInput label="Rental HELOC Rate" value={rentalHelocRate>0?rentalHelocRate:helocRate+0.5} min={4} max={14} step={0.25} onChange={setRentalHelocRate} format={v=>v.toFixed(2)+"%"} hint="Typically 0.5–2% above primary rate" tip="Most lenders charge more for non-owner-occupied HELOC. Leave at default or set precisely."/>
                      </div>

                  {[
                    {label:"Standard Amortization",sub:"Pay minimum — follow the schedule",total:result.baseline.totalInt,pct:100,color:C.red,note:`Over ${mo(result.baseline.months)} you pay ${fmt(result.baseline.totalInt)} in interest alone — in addition to paying back every dollar you borrowed.`},

              {/* ── 3-CURVE CHART ── */}
              {(()=>{
                const mr2=params.mortgageRate/100/12;

                const extra2=Math.max(0,params.monthlyIncome-params.livingExpenses-piPmt2);

                // BASELINE — yearly snapshots + final $0 at exact payoff month
                const bPts=[{yr:0,bal:params.mortgageBal}];
                {let bb=params.mortgageBal,m=0;
                while(bb>0.01&&m<601){m++;bb=Math.max(0,bb+bb*mr2-piPmt2);if(m%12===0)bPts.push({yr:m/12,bal:bb});}

                // DIRECT EXTRA PAYMENTS — yearly snapshots + final $0 at exact payoff month
                const dStart=Math.max(0,params.mortgageBal-params.savings);

                {let db=dStart,m=0;
